<VirtualHost *:80>
    ServerName dominio-real.com
    DocumentRoot "/var/www/sportconnect/public"
    Redirect permanent / https://dominio-real.com/
</VirtualHost>

<VirtualHost *:443>
    ServerName dominio-real.com
    DocumentRoot "/var/www/sportconnect/public"

    SSLEngine on
    SSLCertificateFile /etc/letsencrypt/live/dominio-real.com/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/dominio-real.com/privkey.pem

    <Directory "/var/www/sportconnect/public">
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    <FilesMatch "^\.">
        Require all denied
    </FilesMatch>

    <FilesMatch "\.(env|sql|bak|ini|log|md)$">
        Require all denied
    </FilesMatch>

    LimitRequestBody 10485760

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "DENY"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    Header always set Permissions-Policy "geolocation=(), microphone=(), camera=()"
</VirtualHost>
