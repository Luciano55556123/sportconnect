server {
    listen 80;
    server_name dominio-real.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name dominio-real.com;
    root /var/www/sportconnect/public;
    index index.php;

    ssl_certificate /etc/letsencrypt/live/dominio-real.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dominio-real.com/privkey.pem;

    client_max_body_size 10m;
    autoindex off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ /\.(?!well-known) {
        deny all;
    }

    location ~* \.(env|sql|bak|ini|log|md)$ {
        deny all;
    }

    location ~* /uploads/.*\.(php|phtml|phar|html|js|sh)$ {
        deny all;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param DOCUMENT_ROOT $realpath_root;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
    }
}
