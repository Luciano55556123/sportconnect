name: PHP syntax checks

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  php-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP syntax
        run: |
          php -v
          find app config routes public -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l index.php
